name: Validate Repository Structure

# Runs on every push and pull request targeting main.
# Confirms that the required Part 1 planning artefacts exist inside /docs
# before allowing the build to pass.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing."
            exit 1
          fi
          echo "/docs folder found."

      - name: Check ERD image exists
        run: |
          if ! ls docs/*.png 1> /dev/null 2>&1 && ! ls docs/*.pdf 1> /dev/null 2>&1; then
            echo "ERROR: No ERD image (.png or .pdf) found in /docs."
            exit 1
          fi
          echo "ERD image found."

      - name: Check API endpoint plan exists
        run: |
          if ! ls docs/*endpoint*.md 1> /dev/null 2>&1 && ! ls docs/*endpoint*.pdf 1> /dev/null 2>&1; then
            echo "ERROR: API endpoint plan (.md or .pdf) not found in /docs."
            exit 1
          fi
          echo "API endpoint plan found."

      - name: Check SQL script exists
        run: |
          if ! ls docs/*.sql 1> /dev/null 2>&1; then
            echo "ERROR: SQL script (.sql) not found in /docs."
            exit 1
          fi
          echo "SQL script found."

      - name: Check README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "ERROR: README.md is missing from the repository root."
            exit 1
          fi
          echo "README.md found."

      - name: All checks passed
        run: echo "Repository structure is valid. All required Part 1 files are present."
